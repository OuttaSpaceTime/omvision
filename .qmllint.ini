; qmllint's settings for this repo. qmllint reads this file for any .qml file
; at or below this directory, whether it is run by hand or by bin/check (which
; copies it next to the copy it lints). Only the levels that differ from
; qmllint's own defaults are set here; `qmllint --write-defaults` lists the
; rest, but overwrites this file, comments included.
;
; No category is silenced. The known noise ([missing-property] on Theme.*,
; and the [import] warnings about Theme and Paths not being singletons) comes
; from qmllint not seeing the qmldir Quickshell synthesizes, and bin/check
; fixes that at the root instead: it lints a temp copy with a qmldir that
; declares the singletons (see bin/check, "lint"). Silencing the categories
; would also have hidden real bugs: [missing-property] catches a misspelled
; property or Theme token, [unqualified] a misspelled id, [import] a
; misspelled module. What is left over from before bin/check is listed in
; .qmllint-baseline instead, and only a warning not listed there fails.
;
; Run qmllint by hand on the repo itself and the Theme noise is still there;
; `bin/check lint` is the run to trust.

[General]
MaxWarnings=-1

[Warnings]
; Default: info, which never fails anything. An unused import is always safe
; to delete and costs load time, so make it count.
UnusedImports=warning
